# Single-shot baseline (E_mix variant): T = 0 (one action), n_max = 800.
# Used by single_shot_baseline_mix.py to isolate the effect of sequential
# testing and subsidies, relative to the fiducial_mix run.

rho_S: 2000
rho_S_range: [240, 500, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]
rho_A: 240

c0: 48.9
c1: 0.066
T: 0
n_max: 800
action_stride: 1 # E_mix solver action-grid stride; 1 = dense {1,...,n_max}.
chunk_size: 4096 # E_mix solver backward-induction chunk size; lower if OOM.

epsilon: 0.0
theta_star: 0.65
theta_star_range: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.85, 0.9]

theta_b: 0.5
kappa: 0.05
alpha_0: 1.0
beta_0: 1.0
epsilon_max: 0.9

device: cuda
tol: 1e-6

# Path to the fiducial_mix sensitivity results (needed to recover eps*_fid_mix(rho_S)).
fiducial_sensitivity_path: ../outputs/fiducial_mix/mdp_output/sensitivity_results_mix.pt

save_dir: ../outputs/single_shot_mix/baseline
