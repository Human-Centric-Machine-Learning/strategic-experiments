# Fiducial parameterization with the mixture e-value (E_mix) rejection test.
# All monetary quantities are in $M.

# Principal / social parameters
rho_S: 2000
rho_S_range: [240, 500, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]

# Agent parameters
rho_A: 240

# Trial costs
c0: 48.9
c1: 0.066

# Trial horizon
T: 3
range_T: [0, 1, 2, 3, 4]
n_max: 200
range_n_max: [50, 100, 150, 200, 250, 300]

# E_mix-solver controls
action_stride: 1      # Action grid: {stride, 2*stride, ..., <= n_max}. Higher = faster but coarser policies.
chunk_size: 1024      # Backward-induction batch over (N, X) states; lower if running out of memory.

# Subsidy and efficacy
epsilon: 0.5
theta_star: 0.65
theta_star_range: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.85, 0.9]

# Approval test
theta_b: 0.5
kappa: 0.05
alpha_0: 1.0
beta_0: 1.0
epsilon_max: 0.9

# Runtime settings
device: cuda
tol: 1e-6
save_dir: ../outputs/fiducial_mix/mdp_output
