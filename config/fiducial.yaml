# Fiducial (baseline) parameterization.
# All monetary quantities are in $M.

# Principal / social parameters
rho_S: 2000
rho_S_range: [240, 500, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]
# rho_S_range spans plausible social values of a drug approval. Using a
# statistical-life value of ~$500k, rho_S = 10000 ($M) corresponds to ~20k
# lives saved (an upper bound for an antibiotic) and rho_S = 240 ($M) to
# ~480 lives saved (a lower bound).

# Agent parameters
rho_A: 240   # Rahman et al. (2020): average net present value of antibiotic drugs.

# Trial costs
c0: 48.9     # Moore et al. (2018):        per-stage fixed cost.
c1: 0.066    # Stergiopoulos et al. (2017): per-patient cost.

# Trial horizon
T: 3
range_T: [0, 1, 2, 3, 4]               # used by the runtime-scaling sweep
n_max: 200
range_n_max: [50, 100, 150, 200, 250, 300]  # used by the runtime-scaling sweep

# Subsidy and efficacy
epsilon: 0.3
theta_star: 0.65                       # true efficacy parameter theta*
theta_star_range: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.85, 0.9]

# Approval test
theta_b: 0.5
kappa: 0.05
alpha_0: 1.0
beta_0: 1.0
epsilon_max: 0.9

# Runtime settings
device: cuda
tol: 1e-6
save_dir: ../outputs/fiducial/mdp_output
