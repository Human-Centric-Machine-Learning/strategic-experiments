# Greedy agent scenario: inflated private approval reward rho_A.
# Monetary quantities in $M. Fiducial baseline: rho_A = 240.

# Principal / social parameters
rho_S: 2000
rho_S_range: [240, 500, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]

# Agent parameters (higher than fiducial)
rho_A: 5000

# Trial costs
c0: 48.9
c1: 0.066

# Trial horizon
T: 3
n_max: 200

# Subsidy and efficacy
epsilon: 0.3
theta_star: 0.65
theta_star_range: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.85, 0.9]

# Approval test
theta_b: 0.5
kappa: 0.05
alpha_0: 1.0
beta_0: 1.0
epsilon_max: 0.9

# Runtime settings
device: cuda
tol: 1e-6
save_dir: ../outputs/greedy/mdp_output
